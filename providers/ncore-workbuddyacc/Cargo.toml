[package]
name = "ncore-workbuddyacc"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4"
chrono-tz = "0.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
ncore.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"

[dev-dependencies]
ncore-tokio.workspace = true
tokio = { version = "1.53.3", features = ["full"] }
