[package]
name = "everyend-tauri"
version = "0.1.1-nightly.261126"
edition = "2024"

[features]
# Puts nabu.exe (path in NABUCODE_SERVER_EXE) inside the app, for a one-file build.
embed-server = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = "2"
base64 = "0.22"
mime_guess = "2"
nabu-protocol = { path = "../../crates/nabu-protocol" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Ole"] }

[workspace]

[profile.fast]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256
