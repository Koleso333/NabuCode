<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>NabuCode</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; background: #121212; }
      #startup { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #121212; }
      #startup svg { width: 76px; height: 76px; opacity: .5; animation: pulse 2.1s ease-in-out infinite; }
      #startup circle { fill: none; stroke-width: 10; }
      #startup circle:nth-child(1) { stroke: #343434; }
      #startup circle:nth-child(2) { stroke: #7e7e7e; }
      #startup circle:nth-child(3) { stroke: #ede8e4; }
      @keyframes pulse { 0%, 100% { opacity: .6; } 50% { opacity: .26; } }
      #startup.leaving { opacity: 0; pointer-events: none; transition: opacity 280ms cubic-bezier(.4, 0, .2, 1); }
      @media (prefers-color-scheme: light) {
        html, body, #root, #startup { background: #f8f8f8; }
        #startup circle:nth-child(1) { stroke: #c7c7c7; }
        #startup circle:nth-child(2) { stroke: #8f8f8f; }
        #startup circle:nth-child(3) { stroke: #1d1917; }
      }
      @media (prefers-reduced-motion: reduce) { #startup svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup" aria-label="NabuCode">
      <svg viewBox="0 0 76 76" aria-hidden="true">
        <circle cx="38" cy="38" r="27" />
        <circle cx="38" cy="40" r="27" />
        <circle cx="38" cy="42" r="27" />
      </svg>
    </div>
    <script>
      if (window.__TAURI_INTERNALS__) {
        requestAnimationFrame(() => requestAnimationFrame(() => {
          window.__TAURI_INTERNALS__.invoke("show_main");
        }));
      }
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
