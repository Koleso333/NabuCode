[workspace]
resolver = "3"
members = ["crates/*", "providers/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
publish = false

[workspace.dependencies]
nabu-protocol = { path = "crates/nabu-protocol" }
nabu-server = { path = "crates/nabu-server" }
ncore = { git = "https://github.com/Koleso333/NabuCore", branch = "main" }
ncore-tokio = { git = "https://github.com/Koleso333/NabuCore", branch = "main" }
ncore-mcp = { git = "https://github.com/Koleso333/NabuCore", branch = "main" }
ncore-antigravity = { path = "providers/ncore-antigravity" }
ncore-claudesub = { path = "providers/ncore-claudesub" }
ncore-chatgptsub = { path = "providers/ncore-chatgptsub" }
ncore-zcodeacc = { path = "providers/ncore-zcodeacc" }
ncore-grokacc = { path = "providers/ncore-grokacc" }
ncore-workbuddyacc = { path = "providers/ncore-workbuddyacc" }
ncore-deepaiacc = { path = "providers/ncore-deepaiacc" }
ncore-agentrouter-bp = { path = "providers/ncore-agentrouter-bp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
